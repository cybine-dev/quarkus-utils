quarkus.datasource.db-kind=h2
%postgres.quarkus.database.db-kind=postgres
%mariadb.quarkus.database.db-kind=mariadb

quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=database/changelog.xml

quarkus.hibernate-orm.log.sql=true

quarkus.hibernate-orm.physical-naming-strategy=de.cybine.quarkus.util.datasource.DatasourceNamingStrategy
quarkus.log.category."de.cybine.quarkus.util.datasource".min-level=TRACE
quarkus.log.category."de.cybine.quarkus.util.datasource".level=TRACE

quarkus.cybine.datasource.query.names.table."test"=LIBRARY